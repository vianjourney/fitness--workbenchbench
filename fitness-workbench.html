<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0ea5e9">
<title>减脂增肌综合工作台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273449; --txt:#e2e8f0; --mut:#94a3b8;
  --prim:#0ea5e9; --prim2:#38bdf8; --green:#22c55e; --yellow:#eab308; --red:#ef4444;
  --pk:#f472b6; --bd:#334155; --rd:#64748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5}
a{color:var(--prim2)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--prim);color:#fff;transition:.15s}
button:active{transform:scale(.97)}
button.ghost{background:transparent;border:1px solid var(--bd);color:var(--txt)}
button.sm{padding:7px 10px;font-size:13px;border-radius:9px}
button.danger{background:var(--red)}
input,select,textarea{font-family:inherit;font-size:15px;background:var(--bg);color:var(--txt);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:46px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.app{max-width:760px;margin:0 auto;padding-bottom:88px}
header.top{position:sticky;top:0;z-index:30;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:16px;margin:0;font-weight:700}
header.top .sub{font-size:11px;color:var(--mut)}
.tab-wrap{padding:12px 14px 0}
.tab-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tab-row::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;padding:8px 13px;font-size:13px;border-radius:20px;background:var(--card);color:var(--mut);white-space:nowrap}
.tab-btn.active{background:var(--prim);color:#fff}
.section{display:none;padding:14px;animation:fade .25s}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:7px}
.card h3 .ic{font-size:18px}
.muted{color:var(--mut);font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stat{background:var(--card2);border-radius:12px;padding:11px;text-align:center}
.stat .v{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:var(--mut);margin-top:2px}
.stat .v.green{color:var(--green)}.stat .v.red{color:var(--red)}.stat .v.yellow{color:var(--yellow)}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mut)}
.pill.prim{background:rgba(14,165,233,.18);color:var(--prim2)}
.pill.green{background:rgba(34,197,94,.18);color:var(--green)}
.pill.red{background:rgba(239,68,68,.18);color:var(--red)}
.pill.yellow{background:rgba(234,179,8,.18);color:var(--yellow)}
.pill.pk{background:rgba(244,114,182,.18);color:var(--pk)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600;font-size:11px}
.light{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.y{background:var(--yellow)}.dot.r{background:var(--red)}
.lit{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--bd)}
.lit:last-child{border-bottom:none}
.bar{height:7px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:5px}
.chip{padding:6px 10px;border-radius:10px;background:var(--card2);font-size:12px;border:1px solid transparent}
.chip.sel{border-color:var(--prim);background:rgba(14,165,233,.15);color:var(--prim2)}
.plan{border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--card2)}
.plan.risk{border-color:rgba(239,68,68,.5)}
.plan h4{margin:0 0 4px;font-size:14px;display:flex;gap:6px;align-items:center;justify-content:space-between}
.advice{border-left:3px solid var(--prim);padding:9px 12px;background:var(--card2);border-radius:0 10px 10px 0;margin:8px 0;font-size:13px}
.advice.cut{border-color:var(--pk)}
.advice.bulk{border-color:var(--green)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0b1220;color:#fff;padding:10px 18px;border-radius:24px;border:1px solid var(--prim);font-size:13px;z-index:80;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:84vh;overflow:auto}
.modal h3{margin-top:0}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(15,23,42,.96);backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;max-width:760px;margin:0 auto}
.bottomnav button{flex:1;background:transparent;color:var(--mut);font-size:10.5px;padding:8px 2px 9px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500}
.bottomnav button .nb{font-size:17px}
.bottomnav button.active{color:var(--prim2)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13px}
.canvas-box{position:relative;height:220px}
.cbt{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.hide{display:none!important}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.kv b{color:var(--txt)}
.warn-box{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:10px;font-size:12px;color:#fecaca;margin:8px 0}
.info-box{background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.3);border-radius:10px;padding:10px;font-size:12px;color:#bae6fd;margin:8px 0}
@media(max-width:380px){.g4{grid-template-columns:1fr 1fr}.stat .v{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>💪 减脂增肌综合工作台</h1>
      <div class="sub" id="topSub">数据本地保存 · 可生成永久链接</div>
    </div>
    <button class="ghost sm" onclick="genLink()">🔗 链接</button>
  </header>

  <!-- TAB CONTENT -->
  <div id="view"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottomnav" id="nav"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
   减脂增肌综合工作台  —— 单文件应用
   存储: localStorage  +  永久链接(URL hash 编码全量数据)
   ============================================================ */

const STORE_KEY = 'fit_workbench_v1';
const DAY = () => new Date().toISOString().slice(0,10);
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const round = (n,d=1)=>{const f=Math.pow(10,d);return Math.round(n*f)/f;};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

/* ---------- 默认状态 ---------- */
function defaultState(){
  return {
    goal:'cut', // cut / bulk / maintain
    activity:'moderate',
    targetWeight:null,
    activePlan:'balanced',
    planParams:{},
    body:[],   // {date,weight,height,age,gender,bodyFat,muscleMass}
    ex:[],     // {date,items:[{cat,name,dur,inten}],note}
    diet:[],   // {date,kcal,pro,carb,fat,note,sleep,edema,period}
  };
}
let S = defaultState();

/* ---------- 活动系数 ---------- */
const ACT = {
  sedentary:{f:1.2,n:'久坐(几乎不运动)'},
  light:{f:1.375,n:'轻度(1-3天/周)'},
  moderate:{f:1.55,n:'中度(3-5天/周)'},
  high:{f:1.725,n:'高度(6-7天/周)'},
  extra:{f:1.9,n:'极高(体力工作+训练)'},
};

/* ---------- 运动 MET ---------- */
const EX_META = {
  cardio:{name:'有氧',items:{跑步:{m:9.8},爬坡走:{m:6.0},动感单车:{m:7.5},椭圆机:{m:5.0}}},
  anaerobic:{name:'无氧(力量)',items:{胸:{m:5.0},背:{m:5.0},肩:{m:5.0},臀腿:{m:6.0}}},
  home:{name:'居家跟练',items:{居家跟练视频:{m:6.0},HIIT:{m:8.0},瑜伽拉伸:{m:3.0}}},
};
const INTEN_F={low:.8,mid:1,high:1.2};

/* ---------- 减肥方案库 ---------- */
const PLANS = {
  balanced:{name:'均衡减脂(推荐)',risk:false,type:'normal',
    desc:'适度热量缺口+高蛋白,可持续长期执行,适合大多数人。',
    gen:(p)=>genBalanced(p,'cut')},
  carbCycle:{name:'碳循环减肥法',risk:false,type:'cycle',
    desc:'高低碳日交替,高碳日补充糖原促进训练,低碳日制造缺口,保留肌肉。',
    gen:(p)=>genCarbCycle(p)},
  if168:{name:'16:8 间歇断食',risk:false,type:'if',
    desc:'每日16小时断食+8小时进食窗口,不限制食物种类但控制总热量。',
    gen:(p)=>genIF(p,'16:8')},
  if52:{name:'5:2 轻断食',risk:false,type:'if',
    desc:'每周5天正常饮食,2天非连续低热量日(女500/男600kcal)。',
    gen:(p)=>genIF52(p)},
  yizhibai:{name:'一只白减肥法',risk:true,type:'if',
    desc:'网络流行:黑咖啡+间歇断食+低卡,进食窗口极短。需注意营养不足风险。',
    gen:(p)=>genIF(p,'一只白')},
  douyue:{name:'窦月减肥法',risk:true,type:'liquid',
    desc:'网络流行:以果蔬汁/流食为主的极低热量方案,减重快但易反弹、易流失肌肉。',
    gen:(p)=>genDouyue(p)},
  keto:{name:'生酮饮食',risk:false,type:'keto',
    desc:'极低碳水+高脂肪,强迫身体燃脂供能。需适应期,不适合长期高强度训练。',
    gen:(p)=>genKeto(p)},
  highProtein:{name:'高蛋白饮食',risk:false,type:'normal',
    desc:'高蛋白+适度碳水+低脂,饱腹感强、保肌效果好,适合有训练基础者。',
    gen:(p)=>genHighProtein(p)},
  dukan:{name:'杜坎饮食法',risk:false,type:'normal',
    desc:'分攻击/巡航/巩固/稳定四阶段,以纯蛋白为主逐步引入蔬菜。',
    gen:(p)=>genDukan(p)},
  mediterranean:{name:'地中海饮食',risk:false,type:'normal',
    desc:'公认健康模式:蔬果/全谷/优质脂肪/鱼类为主,温和减脂利于长期健康。',
    gen:(p)=>genMedit(p)},
  copenhagen:{name:'哥本哈根减肥法',risk:true,type:'extreme',
    desc:'13天严格食谱,日均约600-900kcal。极度低热量,仅可短期尝试。',
    gen:(p)=>genCopenhagen(p)},
  potato:{name:'土豆胡萝卜单一食物法',risk:true,type:'extreme',
    desc:'以土豆/胡萝卜为主的极单一饮食,营养严重不均衡,不建议超过3天。',
    gen:(p)=>genPotato(p)},
};

/* ============ 核心计算 ============ */
function latestBody(){
  if(!S.body.length) return null;
  return [...S.body].sort((a,b)=>a.date<b.date?1:-1)[0];
}
function calcBMR(b){
  if(!b) return 0;
  const base = 10*b.weight + 6.25*b.height - 5*b.age;
  return b.gender==='male'? base+5 : base-161;
}
function calcBMI(b){ if(!b||!b.height) return 0; const m=b.height/100; return b.weight/(m*m); }
function calcTDEE(b){
  if(!b) return 0;
  return calcBMR(b)*(ACT[S.activity]?.f||1.55);
}
function bmiCat(v){
  if(v<18.5) return {t:'偏瘦',c:'yellow'};
  if(v<24) return {t:'正常',c:'green'};
  if(v<28) return {t:'超重',c:'yellow'};
  return {t:'肥胖',c:'red'};
}

/* 目标热量(基于目标) */
function targetKcal(){
  const b=latestBody(); if(!b) return {kcal:0,pro:0,carb:0,fat:0,def:0};
  const tdee=calcTDEE(b);
  let kcal,proPer;
  if(S.goal==='cut'){ kcal=tdee-500; proPer=2.0; }
  else if(S.goal==='bulk'){ kcal=tdee+250; proPer=1.8; }
  else { kcal=tdee; proPer=1.6; }
  // 若启用方案,用方案目标覆盖
  if(S.activePlan && PLANS[S.activePlan] && S.activePlan!=='balanced'){
    const tg=PLANS[S.activePlan].gen(b);
    if(tg && tg.daily) return {kcal:tg.daily.kcal,pro:tg.daily.pro,carb:tg.daily.carb,fat:tg.daily.fat,def:tdee-tg.daily.kcal,tdee};
  }
  const pro=round(proPer*b.weight,0);
  const fat=round(0.9*b.weight,0);
  const proK=pro*4, fatK=fat*9;
  const carb=round(Math.max(0,(kcal-proK-fatK)/4),0);
  return {kcal:round(kcal,0),pro,carb,fat,def:round(tdee-kcal,0),tdee};
}

/* 基础均衡方案(可cut/bulk) */
function genBalanced(b,goal){
  const tdee=calcTDEE(b);
  let kcal,proPer;
  if(goal==='cut'){kcal=tdee-500;proPer=2.0;}
  else if(goal==='bulk'){kcal=tdee+250;proPer=1.8;}
  else{kcal=tdee;proPer=1.6;}
  const pro=round(proPer*b.weight,0),fat=round(0.9*b.weight,0);
  const carb=round(Math.max(0,(kcal-pro*4-fat*9)/4),0);
  return {daily:{kcal:round(kcal,0),pro,carb,fat},tdee,
    foods:'瘦肉/鸡蛋/鱼虾为主蛋白,糙米/燕麦/薯类为主碳水,坚果/橄榄油适量脂肪,每餐蔬菜不少于1拳。'};
}
function genCarbCycle(b){
  const tdee=calcTDEE(b);
  const high=tdee, low=tdee-500, mid=tdee-250;
  const w=b.weight;
  const mk=(k,pp,fp,cp)=>{const pro=round(pp*w,0),fat=round(fp*w,0),carb=round(cp*w,0);return {kcal:round(k,0),pro,fat,carb};};
  const days=[
    {d:'高碳日(训练日)',...mk(high,2.0,0.8,Math.max(0,(high-2.0*w*4-0.8*w*9)/4/w))},
    {d:'低碳日(休息日)',...mk(low,2.2,1.0,0.6)},
    {d:'低碳日',...mk(low,2.2,1.0,0.6)},
    {d:'中碳日',...mk(mid,2.0,0.9,Math.max(0,(mid-2.0*w*4-0.9*w*9)/4/w))},
    {d:'高碳日(训练日)',...mk(high,2.0,0.8,Math.max(0,(high-2.0*w*4-0.8*w*9)/4/w))},
    {d:'低碳日',...mk(low,2.2,1.0,0.6)},
    {d:'中碳日',...mk(mid,2.0,0.9,Math.max(0,(mid-2.0*w*4-0.9*w*9)/4/w))},
  ];
  days.forEach(d=>{d.carb=round(d.carb,0);});
  const avg=round(days.reduce((s,x)=>s+x.kcal,0)/7,0);
  return {daily:{kcal:avg,pro:round(days[1].pro,0),carb:round(days.reduce((s,x)=>s+x.carb,0)/7,0),fat:round(days[1].fat,0)},tdee,cycle:days,
    foods:'高碳日:训练前后补碳水(米饭/燕麦/香蕉);低碳日:增加蛋白与蔬菜,碳水仅来自蔬菜;保持总蛋白≥2g/kg。'};
}
function genIF(b,mode){
  const tdee=calcTDEE(b),w=b.weight;
  let kcal=tdee-500;
  if(mode==='一只白') kcal=Math.max(tdee-700, b.weight*22);
  const pro=round(2.0*w,0),fat=round(0.9*w,0),carb=round(Math.max(0,(kcal-pro*4-fat*9)/4),0);
  const win = mode==='16:8'?'12:00-20:00 进食,其余时间只喝水/黑咖啡':'一只白:咖啡延后早餐,中午开始进食,晚7点前结束';
  return {daily:{kcal:round(kcal,0),pro,carb,fat},tdee,window:win,
    foods:'断食期:水/黑咖啡/无糖茶;进食期集中两餐,优先蛋白+蔬菜+适量粗粮,避免暴食补偿。'};
}
function genIF52(b){
  const tdee=calcTDEE(b),w=b.weight;
  const normal={kcal:round(tdee,0),pro:round(1.6*w,0),fat:round(0.9*w,0),carb:round(Math.max(0,(tdee-1.6*w*4-0.9*w*9)/4),0)};
  const fast={kcal:b.gender==='male'?600:500,pro:round(1.0*w,0),fat:10,carb:round(Math.max(0,(b.gender==='male'?600:500-1.0*w*4-90)/4),0)};
  return {daily:normal,tdee,fast,foods:'5天正常餐(控制在TDEE),2天非连续低卡日:清汤/蛋白/蔬菜为主,避免连续两天断食。'};
}
function genDouyue(b){
  const tdee=calcTDEE(b),w=b.weight;
  const kcal=Math.max(tdee-800, 800);
  const pro=round(1.5*w,0),fat=round(0.6*w,0),carb=round(Math.max(0,(kcal-pro*4-fat*9)/4),0);
  return {daily:{kcal:round(kcal,0),pro,carb,fat},tdee,foods:'以果蔬汁/蔬菜汤/少量蛋白为主流食,每日≤3餐。注意:蛋白质不足,强烈建议≤3天并补充蛋白粉。'};
}
function genKeto(b){
  const tdee=calcTDEE(b),w=b.weight;
  const kcal=tdee-400;
  const pro=round(1.5*w,0),carb=30,fat=round(Math.max(0,(kcal-pro*4-carb*4)/9),0);
  return {daily:{kcal:round(kcal,0),pro,carb,fat},tdee,foods:'碳水<50g/天(来自蔬菜/少量莓果),脂肪占60-70%(牛油果/橄榄油/椰子油/肥鱼),蛋白1.5g/kg。'};
}
function genHighProtein(b){
  const tdee=calcTDEE(b),w=b.weight;
  const kcal=tdee-400;
  const pro=round(2.4*w,0),fat=round(0.7*w,0),carb=round(Math.max(0,(kcal-pro*4-fat*9)/4),0);
  return {daily:{kcal:round(kcal,0),pro,carb,fat},tdee,foods:'鸡胸/牛肉/鸡蛋/蛋白粉为主,碳水以粗粮控制量,脂肪尽量低,搭配大量蔬菜。'};
}
function genDukan(b){
  const tdee=calcTDEE(b),w=b.weight;
  const kcal=tdee-500;
  const pro=round(2.2*w,0),fat=round(0.6*w,0),carb=round(Math.max(0,(kcal-pro*4-fat*9)/4),0);
  return {daily:{kcal:round(kcal,0),pro,carb,fat},tdee,foods:'攻击期(1-5天)纯蛋白;巡航期交替纯蛋白日/蛋白+蔬菜日;逐步引入全麦/水果。'};
}
function genMedit(b){
  const tdee=calcTDEE(b),w=b.weight;
  const kcal=tdee-300;
  const pro=round(1.6*w,0),fat=round(1.0*w,0),carb=round(Math.max(0,(kcal-pro*4-fat*9)/4),0);
  return {daily:{kcal:round(kcal,0),pro,carb,fat},tdee,foods:'多蔬果/全谷/豆类/坚果,鱼类每周≥2次,橄榄油为主脂肪,红肉少量,温和可持续。'};
}
function genCopenhagen(b){
  return {daily:{kcal:800,pro:70,carb:50,fat:35},tdee:calcTDEE(b),foods:'严格按13天食谱(鸡蛋/西柚/牛排/蔬菜等组合),日均约800kcal。结束后必须逐步恢复饮食,否则极易反弹。',
    dur:'仅限13天'};
}
function genPotato(b){
  return {daily:{kcal:1000,pro:50,carb:180,fat:10},tdee:calcTDEE(b),foods:'以水煮土豆为主食,搭配少量胡萝卜,极少量油。蛋白质严重不足,建议≤3天并补充蛋白。',
    dur:'仅限3-5天'};
}

/* 运动消耗估算 */
function exCalories(items){
  const b=latestBody(); const w=b?b.weight:60;
  let cardio=0,anaerobic=0,home=0,total=0;
  (items||[]).forEach(it=>{
    const meta=EX_META[it.cat]; if(!meta) return;
    const m=meta.items[it.name]?.m||5;
    const f=INTEN_F[it.inten]||1;
    const c=m*f*w*(it.dur/60);
    total+=c;
    if(it.cat==='cardio')cardio+=c;
    else if(it.cat==='anaerobic')anaerobic+=c;
    else home+=c;
  });
  return {total:round(total,0),cardio:round(cardio,0),anaerobic:round(anaerobic,0),home:round(home,0)};
}

/* 当日饮食记录 */
function dietOfDay(date){
  return S.diet.find(d=>d.date===date);
}
function exOfDay(date){
  return S.ex.find(d=>d.date===date);
}
/* 当日热量缺口 = TDEE + 运动消耗 - 摄入 */
function dayDeficit(date){
  const b=latestBody(); if(!b) return null;
  const tdee=calcTDEE(b);
  const d=dietOfDay(date); const e=exOfDay(date);
  const exCal = e? exCalories(e.items).total:0;
  const inK = d? d.kcal:0;
  return {tdee,ex:exCal,in:inK,def:round(tdee+exCal-inK,0)};
}

/* ============ 数据存取 ============ */
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
function load(){
  try{

      const raw=decodeURIComponent(escape(atob(location.hash.slice(1))));
      S=Object.assign(defaultState(),JSON.parse(raw));
      save();
      history.replaceState(null,'',location.pathname);
    }else{
      const r=localStorage.getItem(STORE_KEY);
      if(r) S=Object.assign(defaultState(),JSON.parse(r));
    }
  }catch(e){ console.warn('load err',e); S=defaultState(); }
}
function genLink(){
  const json=JSON.stringify(S);
  const enc=btoa(unescape(encodeURIComponent(json)));
  const url=location.origin+location.pathname+'#'+enc;
  navigator.clipboard?.writeText(url).catch(()=>{});
  const inp=document.createElement('textarea');inp.value=url;document.body.appendChild(inp);inp.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(inp);

/* ---------- 模块4: 综合分析 ---------- */

  const today=DAY();
  const tg=targetKcal();
  const dd=dayDeficit(today); const d=dietOfDay(today); const e=exOfDay(today);
  const ex=e?exCalories(e.items):{total:0,cardio:0,anaerobic:0,home:0};
  const def = dd?dd.def:0;
  // 1 热量缺口
  let html=`<div class="card">
    <h3><span class="ic">📊</span>今日综合分析 <span class="muted" style="margin-left:auto;font-weight:400">${today}</span></h3>
    <div class="grid g4">
      <div class="stat"><div class="v">${round(calcTDEE(b),0)}</div><div class="l">TDEE</div></div>
      <div class="stat"><div class="v">${ex.total}</div><div class="l">运动消耗</div></div>
      <div class="stat"><div class="v">${d?d.kcal:0}</div><div class="l">摄入kcal</div></div>
      <div class="stat"><div class="v ${def>0?'green':def<0?'red':''}">${def>0?'+':''}${def}</div><div class="l">${def>=0?'热量缺口':'热量盈余'}</div></div>
    </div>
    ${!d?'<div class="warn-box">今日未填报饮食,请先到「饮食」模块录入。</div>':''}
  </div>`;
  // 2 宏量区间评价
  if(d){
    const w=b.weight;
    const proOk = d.pro>= (S.goal==='cut'?1.8:1.6)*w && d.pro<=2.4*w;
    const fatOk = d.fat>=0.6*w && d.fat<=1.2*w;
    const carbR = tg.carb? d.carb/tg.carb:0;
    html+=`<div class="card"><h3><span class="ic">🥩</span>宏量营养区间评价</h3>
      <div class="lit"><span>蛋白质 ${d.pro}g (建议${round(1.8*w,0)}-${round(2.4*w,0)}g)</span><span class="light"><span class="dot ${proOk?'g':'r'}"></span>${proOk?'合理':'需调整'}</span></div>
      <div class="lit"><span>脂肪 ${d.fat}g (建议${round(0.6*w,0)}-${round(1.2*w,0)}g)</span><span class="light"><span class="dot ${fatOk?'g':'y'}"></span>${fatOk?'合理':'需调整'}</span></div>
      <div class="lit"><span>碳水 ${d.carb}g (目标${tg.carb}g)</span><span class="light"><span class="dot ${carbR>=0.8&&carbR<=1.2?'g':carbR<0.8?'y':'r'}"></span>${carbR>=0.8&&carbR<=1.2?'达标':carbR<0.8?'偏低':'偏高'}</span></div>
    </div>`;
  }
  // 3 运动结构评价
  const totEx=ex.total;
  const cardioR=totEx?ex.cardio/totEx:0;
  let exEval='暂无运动记录';
  let exCol='y';
  if(totEx>0){
    if(S.goal==='cut'){
      if(cardioR>=0.4&&cardioR<=0.7){exEval='有氧占比合理,兼顾燃脂与保肌';exCol='g';}
      else if(cardioR>0.7){exEval='有氧偏多,建议增加力量训练以防掉肌';exCol='y';}
      else{exEval='力量偏多,减脂期可适当增加有氧';exCol='y';}
    }else if(S.goal==='bulk'){
      if(ex.anaerobic>0&&cardioR<0.5){exEval='以力量为主,适合增肌';exCol='g';}
      else{exEval='增肌期应以力量训练为主,控制有氧量';exCol='y';}
    }else{
      exEval='运动结构均衡';exCol='g';
    }
  }
  html+=`<div class="card"><h3><span class="ic">🏋️</span>运动结构评价</h3>
    <div class="lit"><span>有氧消耗占比</span><b>${round(cardioR*100,0)}%</b></div>
    <div class="lit"><span>无氧消耗占比</span><b>${totEx?round(ex.anaerobic/totEx*100,0):0}%</b></div>
    <div class="lit"><span>评价</span><span class="pill ${exCol==='g'?'green':exCol==='y'?'yellow':'red'}">${exEval}</span></div>

function weightPredictHtml(def,d){

  <div class="canvas-box" style="margin-top:8px"><canvas id="predChart"></canvas></div>
  <div class="hint">基于7700kcal≈1kg脂肪估算,姨妈期/水肿标记会自动修正。</div></div>`;

function adviceHtml(b,d,ex,def){
  const w=b.weight; const tdee=calcTDEE(b);
  let cut='',bulk='';
  // 减脂向
  if(S.goal!=='bulk'){
    cut=`<div class="advice cut"><b>🔹 减脂向调整建议</b><br>`;
    if(!d){cut+='先完整填报饮食,才能精准评估缺口。';}
    else{
      if(def<300) cut+='当前缺口不足(<300kcal),建议控制在TDEE-500左右,可增加30分钟有氧或减少100-150kcal碳水。<br>';
      if(d.pro<1.8*w) cut+=`蛋白质仅${d.pro}g偏低,建议提升至${round(2.0*w,0)}g以上以防掉肌。<br>`;
      if(ex.anaerobic===0) cut+='今日无力量训练,减脂期建议每周≥2次力量以保肌。<br>';
      if(d.fat>1.2*w) cut+=`脂肪${d.fat}g偏高,适当减少油脂与坚果。<br>`;
      if(def>1000) cut+='缺口过大(>1000kcal),易掉代谢与肌肉,建议提高摄入至TDEE-500。<br>';
      if(!cut.includes('建议')) cut+='当前减脂数据基本合理,继续保持热量缺口与高蛋白。';
    }
    cut+=`</div>`;
  }
  // 增肌向
  if(S.goal!=='cut'){
    bulk=`<div class="advice bulk"><b>🔹 增肌向调整建议</b><br>`;
    if(!d){bulk+='先完整填报饮食。';}

      if(def>0) bulk+=`当前为热量缺口(${def}kcal),增肌需热量盈余,建议摄入TDEE+200~300。<br>`;
      if(d.pro<1.6*w) bulk+=`蛋白质${d.pro}g不足,增肌期建议≥${round(1.8*w,0)}g,分餐摄入更佳。<br>`;
      if(ex.anaerobic===0) bulk+='今日无力量训练,增肌必须以力量训练为驱动,建议每周≥3次。<br>';
      if(d.carb<3*w) bulk+=`碳水${d.carb}g偏低,训练日需充足碳水供能,建议≥${round(4*w,0)}g。<br>`;
      if(!bulk.includes('建议')) bulk+='当前增肌数据合理,保持热量盈余与系统力量训练。';
    }
    bulk+=`</div>`;
  }
  return `<div class="card"><h3><span class="ic">💡</span>建议输出(双方向)</h3>${cut}${bulk||'<div class="muted">当前目标为增肌,已隐藏减脂建议</div>'}${cut||'<div class="muted">当前目标为减脂,已隐藏增肌建议</div>'}</div>`;
}

function plateauHtml(){
  if(S.body.length<3) return '';
  const arr=[...S.body].sort((a,b)=>a.date>b.date?1:-1);
  // 取近3周
  const recent=arr.slice(-3);
  if(recent.length<3) return '';
  const delta=recent[recent.length-1].weight-recent[0].weight;
  const hasDef=S.diet.slice(-7).some(d=>{const dd=dayDeficit(d.date);return dd&&dd.def>200;});
  if(Math.abs(delta)<0.3 && hasDef){
    return `<div class="card" style="border-color:var(--yellow)"><h3><span class="ic">⚠️</span>平台期识别</h3>
    <div class="warn-box" style="background:rgba(234,179,8,.12);border-color:rgba(234,179,8,.4);color:#fde68a">检测到近3周体重几乎未变化(Δ${round(delta,1)}kg),但你仍保持热量缺口,可能进入<b>减脂平台期</b>。</div>

  let comment='';
  const b=latestBody();const w=b?b.weight:60;
  if(avgDef>300) comment=`本周平均热量缺口${avgDef}kcal,按此节奏约${round(avgDef/7700*7,2)}kg/周减重,蛋白摄入${avgPro}g${avgPro<1.8*w?'偏低建议增加':''}。`;
  else if(avgDef>0) comment=`本周缺口偏小(${avgDef}kcal),可适当增加运动或减少100-200kcal摄入。`;
  else if(avgDef<0) comment=`本周整体热量盈余(${avgDef}kcal),体重可能上升,需控制摄入。`;
  else comment='本周数据不足,继续记录以生成复盘。';
  return `<div class="card"><h3><span class="ic">🗓️</span>本周复盘 (${ds} ~ ${de})</h3>
  <div class="grid g4">
    <div class="stat"><div class="v">${avgDef>0?'':''}${avgDef}</div><div class="l">日均缺口kcal</div></div>
    <div class="stat"><div class="v">${avgKcal}</div><div class="l">日均摄入</div></div>
    <div class="stat"><div class="v">${avgPro}</div><div class="l">日均蛋白g</div></div>
    <div class="stat"><div class="v">${exCnt}</div><div class="l">运动天数</div></div>
  </div>
  <div class="advice" style="margin-top:8px">${comment}</div></div>`;
}

/* ---------- 模块7: 设置 ---------- */
function viewSettings(){
  const b=latestBody(); const tg=targetKcal();
  return `<div class="card">
    <h3><span class="ic">🎯</span>当前目标</h3>
    <div class="grid g3">
      <button class="chip ${S.goal==='cut'?'sel':''}" style="text-align:center;padding:12px" onclick="setGoal('cut')">🔥 优先减脂</button>
      <button class="chip ${S.goal==='bulk'?'sel':''}" style="text-align:center;padding:12px" onclick="setGoal('bulk')">💪 优先增肌</button>
      <button class="chip ${S.goal==='maintain'?'sel':''}" style="text-align:center;padding:12px" onclick="setGoal('maintain')">⚖️ 维持</button>
    </div>
    <div class="hint">切换后,分析、建议、营养目标全部联动更新。${S.activePlan!=='balanced'?'当前已启用「'+PLANS[S.activePlan].name+'」,方案目标优先。':''}</div>
  </div>
  <div class="card">
    <h3><span class="ic">🏃</span>活动水平</h3>
    <select onchange="S.activity=this.value;save();render()">
      ${Object.entries(ACT).map(([k,v])=>`<option value="${k}" ${S.activity===k?'selected':''}>${v.n} (×${v.f})</option>`).join('')}
    </select>
    <div class="hint">影响TDEE计算。</div>
  </div>
  <div class="card">
    <h3><span class="ic">🎯</span>自定义目标体重</h3>
    <div class="row">
      <input type="number" step="0.1" id="setTW" value="${S.targetWeight??''}" placeholder="如 60">
      <button onclick="setTargetWeight()">设定</button>
    </div>
    ${targetWeightAdviceHtml(b,tg)}
  </div>
  <div class="card">
    <h3><span class="ic">📊</span>当前营养目标概览</h3>
    <div class="grid g4">
      <div class="stat"><div class="v" style="font-size:16px">${tg.kcal}</div><div class="l">热量kcal</div></div>
      <div class="stat"><div class="v" style="font-size:16px">${tg.pro}</div><div class="l">蛋白g</div></div>
      <div class="stat"><div class="v" style="font-size:16px">${tg.carb}</div><div class="l">碳水g</div></div>
      <div class="stat"><div class="v" style="font-size:16px">${tg.fat}</div><div class="l">脂肪g</div></div>
    </div>
  </div>
  <div class="card">
    <h3><span class="ic">💾</span>数据管理</h3>
    <div class="row wrap" style="gap:8px">
      <button class="ghost sm" onclick="genLink()">🔗 生成永久链接</button>
      <button class="ghost sm" onclick="exportAll()">📋 导出全部</button>
      <button class="danger sm" onclick="resetAll()">🗑 清空所有数据</button>
    </div>
    <div class="hint">数据保存在本地浏览器,清除浏览器缓存会丢失,请定期用链接/导出备份。</div>
  </div>`;
}
function targetWeightAdviceHtml(b,tg){
  if(!b||!S.targetWeight) return '<div class="muted">设定目标体重后,系统将倒推所需热量缺口与预计达成时间。</div>';
  const diff=b.weight-S.targetWeight; // 正=需减
  const needKcal=Math.abs(diff)*7700;
  const dailyDef = tg.def||500;
  const days = Math.abs(diff)>0?Math.ceil(needKcal/Math.abs(dailyDef)):0;
  if(diff>0.2){
    return `<div class="info-box">当前${b.weight}kg → 目标${S.targetWeight}kg,需减${round(diff,1)}kg ≈ ${round(needKcal,0)}kcal。<br>按当前日均缺口${dailyDef}kcal,预计约 <b>${days}天(${round(days/7,1)}周)</b> 达成。</div>`;
  }else if(diff<-0.2){
    return `<div class="info-box">当前${b.weight}kg → 目标${S.targetWeight}kg,需增${round(-diff,1)}kg,增肌期建议热量盈余250kcal,预计约 <b>${Math.ceil(-diff*7700/250)}天</b>。</div>`;
  }
  return '<div class="info-box">已接近目标体重,保持当前节奏即可。</div>';
}
function setGoal(g){ S.goal=g; if(S.activePlan!=='balanced'){/*保留方案*/} save(); toast('目标已切换为'+{cut:'优先减脂',bulk:'优先增肌',maintain:'维持'}[g]); render(); }
function setTargetWeight(){ S.targetWeight=+$('#setTW').value||null; save(); toast('目标体重已设定'); render(); }
function resetAll(){
  showModal(`<h3>🗑 清空所有数据</h3><p>这将删除全部身体/运动/饮食记录,不可恢复。确定继续吗?</p>
  <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px"><button class="ghost sm" onclick="closeModal()">取消</button><button class="danger sm" onclick="S=defaultState();save();closeModal();render();toast('已清空')">确认清空</button></div>`);
}

/* ============ 图表 ============ */
let charts={};
function afterRender(){
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});
  charts={};
  if(curTab==='body'&&S.body.length) drawBodyChart();
  if(curTab==='ex'&&S.ex.length) drawExChart();
  if(curTab==='analysis') drawPredChart();
  if(curTab==='trend'&&S.body.length>=2){drawTrend();drawDefChart();}
}
function drawBodyChart(){
  const arr=[...S.body].sort((a,b)=>a.date>b.date?1:-1);
  const ctx=$('#bodyChart'); if(!ctx)return;
  charts.body=new Chart(ctx,{type:'line',data:{labels:arr.map(a=>a.date.slice(5)),datasets:[
    {label:'体重',data:arr.map(a=>a.weight),borderColor:'#0ea5e9',backgroundColor:'rgba(14,165,233,.1)',tension:.3,spanGaps:true},
    {label:'体脂率',data:arr.map(a=>a.bodyFat),borderColor:'#f472b6',tension:.3,spanGaps:true,yAxisID:'y1'},
  ]},options:chartOpt(true)} );
}
function drawExChart(){
  const now=new Date();const cats={cardio:[],anaerobic:[],home:[]};
  const labels=[];
  for(let i=27;i>=0;i-=7){const s=new Date(now-i*864e5),e=new Date(now-(i-6>0?i-6:0)*864e5);
    labels.push((s.getMonth()+1)+'/'+s.getDate());
    let c={cardio:0,anaerobic:0,home:0};
    S.ex.forEach(d=>{const dt=new Date(d.date);if(dt>=s&&dt<=e)d.items.forEach(it=>c[it.cat]=(c[it.cat]||0)+1);});
    cats.cardio.push(c.cardio);cats.anaerobic.push(c.anaerobic);cats.home.push(c.home);
  }
  const ctx=$('#exChart');if(!ctx)return;
  charts.ex=new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'有氧',data:cats.cardio,backgroundColor:'#38bdf8'},
    {label:'力量',data:cats.anaerobic,backgroundColor:'#22c55e'},
    {label:'居家',data:cats.home,backgroundColor:'#eab308'},
  ]},options:chartOpt(false)});
}
function drawPredChart(){
  const today=DAY();const dd=dayDeficit(today);
  const ctx=$('#predChart');if(!ctx)return;
  const labels=[];const data=[];
  const b=latestBody();const startW=b?b.weight:0;
  const def=dd?dd.def:0;
  for(let i=0;i<=30;i+=2){
    labels.push(i+'天');
    const change = def>0? -def/7700*i : def<0? -def/7700*i : 0;
    data.push(round(startW+change,2));
  }
  charts.pred=new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'预测体重',data,borderColor:def>=0?'#22c55e':'#ef4444',backgroundColor:def>=0?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)',tension:.3}]},
    options:chartOpt(false)});
}
function drawTrend(){
  const arr=[...S.body].sort((a,b)=>a.date>b.date?1:-1);
  const map=[{k:'weight',l:'体重',c:'#0ea5e9'},{k:undefined,l:'BMI',c:'#38bdf8'},{k:'muscleMass',l:'肌肉量',c:'#22c55e'}];
  let ds;
  if(trendTab===1){ds={label:'BMI',data:arr.map(a=>round(calcBMI(a),1)),borderColor:'#38bdf8',backgroundColor:'rgba(56,189,248,.1)',tension:.3,spanGaps:true};}
  else{const m=trendTab===0?map[0]:map[2];ds={label:m.l,data:arr.map(a=>a[m.k]),borderColor:m.c,backgroundColor:'rgba(14,165,233,.1)',tension:.3,spanGaps:true};}
  const ctx=$('#trendChart');if(!ctx)return;
  charts.trend=new Chart(ctx,{type:'line',data:{labels:arr.map(a=>a.date.slice(5)),datasets:[ds]},options:chartOpt(false)});
}
function drawDefChart(){
  const arr=[...S.diet].sort((a,b)=>a.date>b.date?1:-1).slice(-14);
  const labels=arr.map(a=>a.date.slice(5));const data=arr.map(a=>{const dd=dayDeficit(a.date);return dd?dd.def:0;});
  const ctx=$('#defChart');if(!ctx)return;
  charts.def=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'热量缺口',data,backgroundColor:data.map(v=>v>=0?'#22c55e':'#ef4444')}]},
    options:chartOpt(false)});
}
function chartOpt(dual){
  return {responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11}}}},
    scales:{x:{ticks:{color:'#64748b',font:{size:10}},grid:{color:'rgba(148,163,184,.1)'}},
      y:{ticks:{color:'#64748b',font:{size:10}},grid:{color:'rgba(148,163,184,.1)'}},
      ...(dual?{y1:{position:'right',ticks:{color:'#64748b'},grid:{drawOnChartArea:false}}}:{})}};
}

/* ============ 工具 ============ */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function showModal(html){$('#modalBox').innerHTML=html;$('#modalBg').classList.add('show');}
function closeModal(){$('#modalBg').classList.remove('show');}

load();
renderNav();
render();

  <p class="muted" style="margin-top:10px">先到「身体」模块录入你的数据开始吧!点击右上「🔗链接」可生成包含全部数据的永久分享链接。</p>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="sm" onclick="closeModal()">开始使用</button></div>`),300);
}
